name: Bug report
about: Report a reproducible issue without sharing personal data
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Home Assistant version / Mealie version / Atelier version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: Remove API tokens, passwords, URLs containing credentials and personal recipe data.
