name: Validate Cards, Web, and demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cards:
    name: Build and test Cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: git diff --exit-code -- dist web/public/mealie-atelier-cards.js
      - uses: hacs/action@22.5.0
        with:
          category: plugin

  web:
    name: Test standalone Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check web/server.mjs
      - run: node --check web/public/mealie-atelier-cards.js
      - run: node --test web/test/*.test.mjs

  demo:
    name: Build bilingual demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run build:demo
      - run: test -s demo/public-site/assets/mealie-atelier-icon-192.png
      - run: test -s demo/public-site/de/index.html
      - run: test -s demo/public-site/en/index.html
      - run: test "$(find demo/public-site/de/rezepte -name index.html | wc -l | tr -d ' ')" -eq 10
      - run: test "$(find demo/public-site/en/recipes -name index.html | wc -l | tr -d ' ')" -eq 10
